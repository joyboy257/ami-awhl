<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">AMI — evidence-backed market intelligence</title>
  <desc id="desc">A clean blue market-intelligence banner showing discovery, crawling, extraction, scoring, monitoring, and decision surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="28" fill="url(#grid)"/>
  <ellipse cx="1030" cy="230" rx="320" ry="290" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="1" y="1" width="1278" height="498" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(72 62)">
    <rect width="58" height="58" rx="16" fill="#1d4ed8"/>
    <path d="M15 41V27h7v14zm11 0V18h7v23zm11 0V10h7v31z" fill="#dbeafe"/>
    <text x="82" y="39" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="730" letter-spacing="4">AMI</text>
    <text x="162" y="39" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="1">MARKET INTELLIGENCE</text>
  </g>

  <g transform="translate(72 176)">
    <text fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="55" font-weight="680" letter-spacing="-2.3">
      <tspan x="0" y="0">Know the market.</tspan>
      <tspan x="0" y="64">Show the evidence.</tspan>
    </text>
    <text x="0" y="148" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Automated discovery, crawling, commercial extraction, scoring,</text>
    <text x="0" y="179" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">change monitoring, and executive competitive intelligence.</text>

    <g transform="translate(0 219)">
      <rect width="150" height="42" rx="21" fill="#3b82f6" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.42"/>
      <circle cx="21" cy="21" r="4" fill="#60a5fa"/>
      <text x="36" y="27" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Evidence-linked</text>
      <rect x="164" width="158" height="42" rx="21" fill="#22c55e" fill-opacity="0.11" stroke="#4ade80" stroke-opacity="0.32"/>
      <circle cx="185" cy="21" r="4" fill="#4ade80"/>
      <text x="200" y="27" fill="#dcfce7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Change-aware</text>
      <rect x="336" width="166" height="42" rx="21" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="357" cy="21" r="4" fill="#f59e0b"/>
      <text x="372" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Decision-ready</text>
    </g>
  </g>

  <g transform="translate(780 88)" filter="url(#shadow)">
    <rect width="420" height="330" rx="24" fill="#f8fafc"/>
    <rect x="0" y="0" width="420" height="52" rx="24" fill="#ffffff"/>
    <rect x="0" y="34" width="420" height="18" fill="#ffffff"/>
    <circle cx="26" cy="26" r="5" fill="#3b82f6"/>
    <text x="42" y="31" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Market overview</text>
    <text x="334" y="31" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">LIVE EVIDENCE</text>

    <g transform="translate(20 72)">
      <rect width="118" height="74" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="14" y="24" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">VISIBILITY</text>
      <text x="14" y="55" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">78</text>
      <path d="M75 55l9-10 9 5 11-18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="130" width="118" height="74" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="144" y="24" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">SHARE OF VOICE</text>
      <text x="144" y="55" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">24%</text>

      <rect x="260" width="120" height="74" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="274" y="24" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">CHANGES</text>
      <text x="274" y="55" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760">12</text>
      <circle cx="352" cy="47" r="9" fill="#fef3c7"/>
      <path d="M352 41v7m0 4h.01" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

      <rect y="92" width="380" height="146" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="16" y="118" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Competitive score map</text>
      <line x1="16" y1="210" x2="364" y2="210" stroke="#e5e7eb"/>
      <rect x="34" y="164" width="34" height="46" rx="4" fill="#93c5fd"/>
      <rect x="86" y="140" width="34" height="70" rx="4" fill="#3b82f6"/>
      <rect x="138" y="176" width="34" height="34" rx="4" fill="#bfdbfe"/>
      <rect x="190" y="128" width="34" height="82" rx="4" fill="#22c55e"/>
      <rect x="242" y="151" width="34" height="59" rx="4" fill="#60a5fa"/>
      <rect x="294" y="184" width="34" height="26" rx="4" fill="#f59e0b"/>
    </g>
  </g>
</svg>
